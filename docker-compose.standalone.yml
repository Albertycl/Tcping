# Self-contained stack for anyone cloning the repo: own MariaDB, seeded from demo/seed_demo_data.sql.
services:
  db:
    image: mariadb:11.1
    environment:
      MARIADB_DATABASE: tcping
      MARIADB_USER: tcping
      MARIADB_PASSWORD: ${MYSQL_APP_PASSWORD:?copy .env.example to .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - ./demo/seed_demo_data.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://tcping:${MYSQL_APP_PASSWORD}@db:3306/tcping
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend_webtcping
    ports:
      - "${FRONTEND_PORT:-5435}:80"
    depends_on: [backend]
    restart: unless-stopped

volumes:
  dbdata:
